spring.application.name=blog-backend
server.port=8081
server.address=${BLOG_BIND_ADDRESS:127.0.0.1}
spring.profiles.default=local
spring.datasource.url=${BLOG_DB_URL:jdbc:mysql://127.0.0.1:3307/blog?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${BLOG_DB_USER:blog_admin}
spring.datasource.password=${BLOG_DB_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=false
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.banner=false
spring.data.redis.host=${BLOG_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${BLOG_REDIS_PORT:6380}
spring.data.redis.password=${BLOG_REDIS_PASSWORD:}
spring.data.redis.timeout=350ms
spring.data.redis.connect-timeout=350ms
blog.cache.enabled=${BLOG_CACHE_ENABLED:true}
blog.jwt.secret-base64=${BLOG_JWT_SECRET:}
blog.jwt.issuer=http://localhost:8081
blog.setup.enabled=${BLOG_SETUP_ENABLED:false}
blog.storage.root=${BLOG_STORAGE_ROOT:../storage/uploads}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
server.error.include-message=never
server.error.include-stacktrace=never
